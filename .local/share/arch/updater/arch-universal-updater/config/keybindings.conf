# =============================================================================
# keybindings.conf - dashboard keyboard shortcuts
# =============================================================================
# Format: ACTION=KEY  (single character, case-sensitive)
# Changing these remaps the dashboard's interactive controls.
# =============================================================================

KEY_QUIT="q"                # quit safely after current package
KEY_LOG_TOGGLE="l"          # toggle live log panel
KEY_PAUSE="p"                # pause after current package
KEY_RETRY_FAILED="r"        # retry only failed packages
KEY_CLEANUP_TOGGLE="c"      # toggle cleanup stage
KEY_SUMMARY="s"              # show update summary
KEY_DOWNLOAD_STATS="d"      # show download statistics
KEY_THEME_SWITCH="t"        # cycle themes
KEY_COMPACT_TOGGLE="f"      # toggle compact/full dashboard
KEY_EXPORT="e"                # export update report
KEY_HELP="h"                  # show help
KEY_HELP_ALT="?"             # show all shortcuts

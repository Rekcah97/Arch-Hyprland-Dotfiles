# =============================================================================
# Arch Universal Updater - Main Configuration
# =============================================================================
# Lines beginning with # are comments. Format: KEY=VALUE (no spaces around =)
# This file is sourced directly by lib/parser.sh, so keep values shell-safe
# (quote anything containing spaces).
# =============================================================================

# ----- Appearance -----------------------------------------------------------
THEME="default"                # default | nord | catppuccin | dark
REFRESH_RATE=0.25              # dashboard redraw interval, in seconds
COMPACT_MODE="false"           # start in compact dashboard layout

# ----- Update behavior --------------------------------------------------
ENABLE_PACMAN="true"
ENABLE_YAY="true"
ENABLE_FLATPAK="true"

AUTO_RETRY="true"              # automatically retry failed packages
RETRY_COUNT=3                  # max retry attempts per failed package
RETRY_DELAY=3                  # seconds to wait between retries

MIRROR_REFRESH="false"         # refresh pacman mirrorlist before updating

# ----- Cleanup ----------------------------------------------------------
CLEANUP_ENABLED="false"        # run cleanup stage after updates finish
CLEANUP_ORPHANS="true"         # remove orphaned pacman packages
CLEANUP_FLATPAK_UNUSED="true"  # remove unused flatpak runtimes
CLEANUP_PACCACHE="true"        # trim the pacman package cache

# ----- Notifications ------------------------------------------------------
NOTIFICATIONS_ENABLED="true"
NOTIFY_ON_FINISH="true"
NOTIFY_ON_FAILURE="true"
NOTIFY_ON_RETRY_COMPLETE="true"
NOTIFY_ON_CLEANUP="true"

# ----- Logging ------------------------------------------------------------
LOG_DIR="logs"
LOG_FILE="latest.log"
LOG_ARCHIVE_COUNT=10           # number of archived logs to keep

# ----- Networking ---------------------------------------------------------
CONNECTIVITY_CHECK_HOST="archlinux.org"
DNS_CHECK_HOST="one.one.one.one"
MIN_FREE_DISK_MB=1024           # minimum free space required on / (in MB)

# ----- Misc -----------------------------------------------------------------
CACHE_DIR="cache"
STATE_DIR="cache/state"         # runtime state files used by the dashboard

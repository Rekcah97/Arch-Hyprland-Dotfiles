# BACKGROUND
background {
    monitor =
    path = /home/rekcah/.local/share/wallpaper/wp6773888-minimalist-pc-wallpapers.jpg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}
# USER AVATAR
image {
    monitor =
    path = /home/rekcah/.local/share/profile/profile.jpg  # or ~/.face
    size = 150
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, 5
    halign = center
    valign = center
}


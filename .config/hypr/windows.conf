}
# Window rules for web apps

windowrule {
name = brave-webapp
match:class = ^(brave-.*)$
float = false
center = false
size = 1400 900

}
windowrule {
name = yayfzf-float
match:class = ^(Alacritty)$
match:title = ^(yayfzf)$
float = true
center = true
size = 700 430
}
windowrule {
    name = steam-filepicker
    match:class = ^(steam)$
    match:title = ^(Open)$
    float = true
    center = true
    size = 900 600
}